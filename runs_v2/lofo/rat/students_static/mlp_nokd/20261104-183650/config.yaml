# Kontrola (static): rovnaké malé MLP bez destilácie (iba skutočné označenia).
# Veľkosť siete (NÁVRH): 1 skrytá vrstva s 16–64 neurónmi; overiť benchmarkom, že CPU čas na vzorku
# je aspoň 10× nižší než u učiteľa (docs/00, docs/05). Rovnaký priestor ako študent mlp_kd, aby sa porovnanie týkalo iba destilácie.
name: mlp_nokd
approach: static
results_approach: students_static
model: mlp
description: "kontrola – rovnaké malé MLP bez destilácie (iba skutočné označenia)"
protocol: configs/protocol.yaml
# bez destilácie – kontrolný model k static/mlp_kd
search_space:
  hidden_width: {type: categorical, choices: [16, 32, 64]}
  dropout: {type: float, low: 0.0, high: 0.3}
  lr: {type: float, low: 3.0e-4, high: 3.0e-3, log: true}
  weight_decay: {type: float, low: 1.0e-6, high: 1.0e-3, log: true}
  batch_size: {type: categorical, choices: [256, 512, 1024]}

fixed_params:
  hidden_layers: 1
  max_epochs: 100
  patience: 8
smoke_overrides:
  max_epochs: 2
