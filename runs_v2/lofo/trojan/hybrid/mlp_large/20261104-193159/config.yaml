name: mlp_large
approach: hybrid
model: mlp
description: veľká neurónová sieť (3–5 skrytých vrstiev, 512–2048 neurónov), kandidát na učiteľa
protocol: configs/protocol.yaml
search_space:
  hidden_layers: {type: int, low: 3, high: 5}
  hidden_width: {type: categorical, choices: [512, 1024, 2048]}
  width_decay: {type: categorical, choices: [0.5, 1.0]}
  dropout: {type: float, low: 0.1, high: 0.5}
  lr: {type: float, low: 1.0e-4, high: 3.0e-3, log: true}
  weight_decay: {type: float, low: 1.0e-6, high: 1.0e-2, log: true}
  batch_size: {type: categorical, choices: [256, 512, 1024]}
fixed_params:
  max_epochs: 100
  patience: 8
smoke_overrides:
  max_epochs: 2
