# Príprava dynamických (Speakeasy) dát. Výstup: processed/dynamic/
# Hodnoty označené NÁVRH sa potvrdia až po audite TRÉNINGOVÝCH reportov (nie podľa testu).

speakeasy_listing: data/quovadis-speakeasy/.cache/huggingface/trees/fc2e98fac0b4d43a5557ccab70c877af6cce9f4d.json

# revízia datasetu dtrizna/quovadis-speakeasy na Hugging Face (null = aktuálna; zafixovať po stiahnutí)
speakeasy_revision: null

audit:
  workers: 10
  tiny_max_api_calls: 5        # "malý report" pre audit (iba popis)
  api_limit: 500               # max_api_count v speakeasy-config.json; vstupný bod s >= 500 volaniami bol orezaný
  top_k: 15

# Normalizovaná cache reportov (deterministická, nič sa neučí): processed/dynamic/cache/
cache:
  workers: 10
  lowercase_api: true          # kernel32.X a KERNEL32.X = to isté volanie
  max_arg_chars: 64            # argumenty sa ukladajú orezané (samostatný súbor, voliteľné použitie)
  keep_args: true

# Pevný vektor pre spoločný rebríček modelov (vrstva A) – slovník sa učí IBA na tréningu. NÁVRH.
tabular:
  ngram_range: [1, 2]          # jednotlivé API volania a dvojice po sebe idúcich volaní
  min_doc_freq: 5              # n-gram musí byť aspoň v 5 tréningových vzorkách
  max_features: 2000           # najčastejšie n-gramy podľa dokumentovej frekvencie na tréningu
  count_transform: none        # uložia sa surové počty; log1p a škálovanie robí model (ako pri statických dátach)
  include_events: true         # počty udalostí (súbory, register, sieť, procesy, ...)
  include_summary: true        # súhrnné príznaky: počet vstupných bodov, vlákien, volaní, chýb emulácie, ...

# Postupnosti API volaní pre sekvenčné modely (vrstva B) – slovník IBA z tréningu. NÁVRH (potvrdiť po audite tréningu).
sequence:
  max_len: 1024                # prvých N volaní celej vzorky (vstupné body za sebou); dlhšie sa orežú, kratšie doplnia 0
  min_freq: 5                  # API musí byť aspoň v 5 tréningových vzorkách, inak = neznáme (UNK)
  max_vocab: 20000
