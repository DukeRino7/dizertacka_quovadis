# Analýza využívania príznakov (src/evaluation/feature_importance.py). Iba validácia.
seed: 42
repeats: 5                 # počet náhodných premiešaní na skupinu / príznak
validation_rows: null      # null = celá validácia
shap_rows: 3000            # podvzorka validácie pre SHAP (LightGBM)
top_k: 20
# Príznaky podozrivé z artefaktu zberu dát (najsilnejšie samostatné príznaky a časový posun; docs/02, docs/03)
watch_features:
  - general_has_signature
  - datadir_CERTIFICATE_TABLE_size
  - datadir_CERTIFICATE_TABLE_virtual_address
  - header_coff_timestamp
  - strings_urls
  - datadir_RESOURCE_TABLE_size
