# Študent (V4, docs/19 3.2): malé MLP učené destiláciou z mlp_large na hybridnom vstupe (komplexný hybridný
# učiteľ; obdoba mlp_kd_twobranch z V2 – dvojvetvová sieť na KronoDroid nie je, dynamika nemá poradie).
name: mlp_kd_heavy
approach: static
results_approach: students_static
model: mlp
description: "študent – malé MLP učené destiláciou z mlp_large hybridu (V4)"
protocol: configs/protocol.yaml
distillation:
  teacher: hybrid/mlp_large        # V4 (docs/19 3.2): komplexný hybridný učiteľ
search_space:
  hidden_width: {type: categorical, choices: [16, 32, 64]}
  dropout: {type: float, low: 0.0, high: 0.3}
  lr: {type: float, low: 3.0e-4, high: 3.0e-3, log: true}
  weight_decay: {type: float, low: 1.0e-6, high: 1.0e-3, log: true}
  batch_size: {type: categorical, choices: [256, 512, 1024]}
  kd_alpha: {type: float, low: 0.1, high: 0.9}          # váha skutočných označení (zvyšok = učiteľ)
  kd_temperature: {type: float, low: 1.0, high: 8.0}
fixed_params:
  hidden_layers: 1
  max_epochs: 100
  patience: 8
smoke_overrides:
  max_epochs: 2
